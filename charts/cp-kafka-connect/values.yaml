# Default values for cp-kafka-connect.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

## Minimum number of servers available to ensure the availability of kafka-connect service
## minAvailable: 2

## Image Info
## ref: https://hub.docker.com/r/confluentinc/cp-kafka/
image: confluentinc/cp-kafka-connect
imageTag: 6.1.0

## Specify a imagePullPolicy
## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
imagePullPolicy: IfNotPresent

## Specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
imagePullSecrets:

servicePort: 8083

## Deployment strategy
strategy:
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 1

minReadySeconds: 0

## Kafka Connect properties
## ref: https://docs.confluent.io/current/connect/userguide.html#configuring-workers
configurationOverrides:
  "plugin.path": "/usr/share/java,/usr/share/confluent-hub-components"
  "key.converter": "io.confluent.connect.avro.AvroConverter"
  "value.converter": "io.confluent.connect.avro.AvroConverter"
  "key.converter.schemas.enable": "false"
  "value.converter.schemas.enable": "false"
  "internal.key.converter": "org.apache.kafka.connect.json.JsonConverter"
  "internal.value.converter": "org.apache.kafka.connect.json.JsonConverter"
  "config.storage.replication.factor": "3"
  "offset.storage.replication.factor": "3"
  "status.storage.replication.factor": "3"

## Kafka Connect JVM Heap Option
heapOptions: "-Xms512M -Xmx512M"

## Additional env variables
## CUSTOM_SCRIPT_PATH is the path of the custom shell script to be ran mounted in a volume
customEnv: {}
  # CUSTOM_SCRIPT_PATH: /etc/scripts/create-connectors.sh

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## Custom pod annotations
podAnnotations: {}

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
nodeSelector: {}

## Taints to tolerate on node assignment:
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

## Pod scheduling constraints
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

## Monitoring
## Kafka Connect JMX Settings
## ref: https://kafka.apache.org/documentation/#connect_monitoring
jmx:
  port: 5555

## Prometheus Exporter Configuration
## ref: https://prometheus.io/docs/instrumenting/exporters/
prometheus:
  ## JMX Exporter Configuration
  ## ref: https://github.com/prometheus/jmx_exporter
  jmx:
    enabled: true
    image: solsson/kafka-prometheus-jmx-exporter@sha256
    imageTag: 6f82e2b0464f50da8104acd7363fb9b995001ddff77d248379f8788e78946143
    imagePullPolicy: IfNotPresent
    port: 5556

    ## Resources configuration for the JMX exporter container.
    ## See the `resources` documentation above for details.
    resources: {}

## You can list load balanced service endpoint, or list of all brokers (which is hard in K8s).  e.g.:
## bootstrapServers: "PLAINTEXT://dozing-prawn-kafka-headless:9092"
kafka:
  bootstrapServers: ""

## If the Kafka Chart is disabled a URL and port are required to connect
## e.g. gnoble-panther-cp-schema-registry:8081
cp-schema-registry:
  url: ""

## List of volumeMounts for connect server container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
volumeMounts:
# - name: credentials
#   mountPath: /etc/creds-volume

## List of volumeMounts for connect server container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
volumes:
# - name: credentials
#   secret:
#     secretName: creds

## Secret with multiple keys to serve the purpose of multiple secrets
## Values for all the keys will be base64 encoded when the Secret is created or updated
## ref: https://kubernetes.io/docs/concepts/configuration/secret/
secrets:
  # username: kafka123
  # password: connect321


## Blinkit specific labels required for prod deployment
serviceInventoryLabels: {}

## To ensure zero downtime during rolling updates
startupProbe:
  # httpGet:
  #   path: /connectors
  #   port: 8083
  # periodSeconds: 10
  # failureThreshold: 30

## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  # httpGet:
  #   path: /connectors
  #   port: 8083
  # initialDelaySeconds: 30
  # periodSeconds: 5
  # failureThreshold: 10

## External Access
## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
external:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  port: 8083


## Horizontal Pod Autoscaler (HPA) Configuration
## This section enables automatic scaling of Kafka Connect pods based on resource utilization
## and custom metrics. Designed specifically for Kafka Connect workloads with appropriate
## scaling behaviors to maintain connector stability during scaling operations.
##
## Key Considerations for Kafka Connect Scaling:
## - Connectors undergo rebalancing when pods are added/removed
## - Conservative scale-down prevents frequent rebalancing
## - Responsive scale-up handles traffic spikes efficiently
## - Support for multiple metrics allows complex scaling logic
autoscaling:
  # Enable/disable HPA for this deployment
  enabled: false
  
  # Minimum and maximum number of replicas
  # Set minReplicas to your baseline load requirement
  # Set maxReplicas based on your resource limits and connector distribution needs
  minReplicas: 1
  maxReplicas: 10
  
  # Primary scaling metric: CPU utilization percentage (0-100)
  # Recommended: 70-80% for Kafka Connect to allow headroom for connector rebalancing
  # Set to null to disable CPU-based scaling
  targetCPUUtilizationPercentage: 75
  
  # Secondary scaling metric: Memory utilization percentage (0-100)  
  # Usually stable for Kafka Connect, but useful as a safety measure
  # Set to null to disable memory-based scaling
  targetMemoryUtilizationPercentage: 85
  
  # Scaling behavior configuration optimized for Kafka Connect
  behavior:
    scaleDown:
      # Conservative scale-down to prevent frequent connector rebalancing
      # Longer stabilization prevents rapid scale-down cycles
      stabilizationWindowSeconds: 300  # 5 minutes
      
      # Pod-based scaling policy (primary)
      podsPolicy:
        value: 1  # Scale down 1 pod at a time
        periodSeconds: 60  # Evaluation period
      
      # Percentage-based scaling policy (optional)
      percentPolicy:
        enabled: false  # Disabled by default
        value: 10  # Scale down by 10% at a time
        periodSeconds: 60
      
      # Policy selection: "Min" = most conservative, "Max" = most aggressive
      selectPolicy: "Min"
    
    scaleUp:
      # Responsive scale-up for handling traffic spikes
      # Shorter stabilization allows faster response to load increases
      stabilizationWindowSeconds: 60  # 1 minute
      
      # Pod-based scaling policy (primary)
      podsPolicy:
        value: 2  # Scale up 2 pods at a time for faster response
        periodSeconds: 30  # Faster evaluation for scale-up
      
      # Percentage-based scaling policy (for large clusters)
      percentPolicy:
        enabled: true  # Enabled for large-scale deployments
        value: 50  # Scale up by 50% for rapid response
        periodSeconds: 30
      
      # Policy selection: "Max" = most aggressive scale-up
      selectPolicy: "Max"
  
  # Optional: Custom annotations for the HPA resource
  annotations: {}
    # Example: monitoring.coreos.com/enable: "true"
  
  # Advanced: Custom metrics for sophisticated scaling logic
  # Supports JMX metrics, external metrics, and object-based metrics
  customMetrics: []
    # Example configurations:
    # 
    # # Scale based on Kafka Connect connector lag (requires custom metrics adapter)
    # - name: kafka_connect_connector_lag_total
    #   type: Pods
    #   targetType: AverageValue
    #   targetValue: "1000"  # Scale when average lag > 1000 messages
    #   selector:
    #     matchLabels:
    #       app: kafka-connect
    # 
    # # Scale based on JMX connector throughput metrics
    # - name: kafka_connect_connector_task_batch_size_avg
    #   type: Object
    #   targetType: Value
    #   targetValue: "500"
    #   describedObject:
    #     apiVersion: v1
    #     kind: Service
    #     name: kafka-connect-jmx-metrics
    #
    # # Scale based on Kafka consumer lag from external monitoring
    # - name: kafka_consumer_lag_sum
    #   type: External
    #   targetType: Value
    #   targetValue: "5000"
    #   selector:
    #     matchLabels:
    #       consumer_group: "connect-cluster"
